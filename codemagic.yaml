workflows:
  ios-real-device-smoke:
    name: Day 7 iOS Real Device Smoke
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: "3.44.7"
      xcode: "26.4"
      cocoapods: "1.16.2"
      java: "17"
      vars:
        BUNDLE_ID: com.pawmate.pawmateMobile
        PAWMATE_BACKEND_HEALTH_TIMEOUT_MS: "70000"
        PAWMATE_BACKEND_HEALTH_RETRY_INTERVAL_MS: "5000"
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.pawmate.pawmateMobile
    scripts:
      - name: Explain required runtime variables
        script: |
          set -euo pipefail
          if [ -z "${PAWMATE_API_BASE_URL:-}" ]; then
            echo "PAWMATE_API_BASE_URL is required for backend-backed register/login smoke."
          fi
          echo "This workflow produces a signed IPA artifact after Apple Developer signing is connected in Codemagic."
      - name: Validate backend URL for mobile smoke
        script: |
          set -euo pipefail
          node scripts/ci/validate-mobile-backend-url.mjs
      - name: Install Flutter dependencies
        script: |
          set -euo pipefail
          cd mobile
          flutter pub get
      - name: Static analysis
        script: |
          set -euo pipefail
          cd mobile
          flutter analyze
      - name: Unit and widget tests
        script: |
          set -euo pipefail
          cd mobile
          flutter test
      - name: Configure iOS signing
        script: |
          set -euo pipefail
          cd mobile
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          set -euo pipefail
          cd mobile
          flutter build ipa --release \
            --dart-define=PAWMATE_API_BASE_URL="${PAWMATE_API_BASE_URL}"
    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - mobile/build/ios/archive/*.xcarchive
    publishing:
      email:
        recipients:
          - duongngo0708@gmail.com
        notify:
          success: true
          failure: true

  ios-appetize-simulator-smoke:
    name: PawMate iOS Hosted Compile and Render
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: "3.44.7"
      xcode: "26.4"
      cocoapods: "1.16.2"
      java: "17"
      vars:
        PAWMATE_API_BASE_URL: https://pawmate-api-yteu.onrender.com
        PAWMATE_BACKEND_HEALTH_TIMEOUT_MS: "70000"
        PAWMATE_BACKEND_HEALTH_RETRY_INTERVAL_MS: "5000"
        PAWMATE_ENABLE_SYSTEM_PROXY: "true"
        PAWMATE_INITIAL_ROUTE: /auth/login
        PAWMATE_QA_AUTORUN_AUTH_SMOKE: "true"
        PAWMATE_QA_PREFILL_AUTH: "true"
        PAWMATE_QA_AUTH_EMAIL: day8-appetize-verified@pawmate.test
    scripts:
      - name: Explain Appetize simulator path
        script: |
          set -euo pipefail
          echo "This workflow builds an iOS Simulator .app for Appetize."
          echo "Appetize accepts a zip/tar.gz containing a simulator .app; device IPAs are not supported by Appetize."
          echo "Backend-backed register/login smoke requires a public HTTPS PAWMATE_API_BASE_URL."
          echo "Set PAWMATE_ENABLE_SYSTEM_PROXY=true when Appetize Network Logs must capture Flutter/Dio traffic."
      - name: Validate backend URL for mobile smoke
        script: |
          set -euo pipefail
          node scripts/ci/validate-mobile-backend-url.mjs
      - name: Install Flutter dependencies
        script: |
          set -euo pipefail
          cd mobile
          flutter pub get
      - name: Static analysis
        script: |
          set -euo pipefail
          cd mobile
          flutter analyze
      - name: Platform-neutral unit and widget tests
        script: |
          set -euo pipefail
          cd mobile
          # Runtime golden masters are verified on the pinned Windows host.
          # macOS renders text and icons differently, so this iOS proof lane
          # runs every non-visual suite and verifies rendering on Simulator
          # in the dedicated step below.
          flutter test \
            test/accessibility \
            test/app \
            test/core \
            test/features \
            test/test_support \
            test/visual/phase1_auth_screenshot_proof_test.dart \
            test/visual/visual_diff_helpers_test.dart \
            test/widget_test.dart
      - name: Verify Day 40 Rescue staging feature profile
        script: |
          set -euo pipefail
          cd mobile
          flutter test \
            --dart-define-from-file=config/day40-rescue-create-staging.json \
            test/app/router/app_feature_availability_day40_test.dart
      - name: Build iOS simulator app
        script: |
          set -euo pipefail
          cd mobile
          flutter build ios --simulator --debug \
            --dart-define-from-file=config/day40-rescue-create-staging.json \
            --dart-define=PAWMATE_API_BASE_URL="${PAWMATE_API_BASE_URL}" \
            --dart-define=PAWMATE_ENABLE_SYSTEM_PROXY="${PAWMATE_ENABLE_SYSTEM_PROXY:-false}" \
            --dart-define=PAWMATE_INITIAL_ROUTE="${PAWMATE_INITIAL_ROUTE:-/launch}" \
            --dart-define=PAWMATE_QA_AUTORUN_AUTH_SMOKE="${PAWMATE_QA_AUTORUN_AUTH_SMOKE:-false}" \
            --dart-define=PAWMATE_QA_PREFILL_AUTH="${PAWMATE_QA_PREFILL_AUTH:-false}" \
            --dart-define=PAWMATE_QA_AUTH_EMAIL="${PAWMATE_QA_AUTH_EMAIL:-}" \
            --dart-define=PAWMATE_QA_AUTH_PASSWORD="${PAWMATE_QA_AUTH_PASSWORD:-}"
      - name: Capture iOS simulator render proof
        script: |
          set -euo pipefail
          APP_PATH="${CM_BUILD_DIR}/mobile/build/ios/iphonesimulator/Runner.app"
          PROOF_DIR="${CM_BUILD_DIR}/output-evidence/ios-post-change"
          BUNDLE_ID="com.pawmate.pawmateMobile"
          mkdir -p "${PROOF_DIR}"

          DEVICE_INFO="$(
            python3 - <<'PY'
          import json
          import re
          import subprocess

          payload = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "--json"],
                  text=True,
              )
          )
          candidates = []
          for runtime, devices in payload.get("devices", {}).items():
              match = re.search(r"\.iOS-(\d+)(?:-(\d+))?", runtime)
              version = tuple(int(part or 0) for part in match.groups()) if match else (0, 0)
              for device in devices:
                  if device.get("isAvailable") and str(device.get("name", "")).startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"], device.get("state", "")))
          if not candidates:
              raise SystemExit("No available iPhone simulator found")
          version, name, udid, state = sorted(candidates, reverse=True)[0]
          print(json.dumps({"runtime_version": version, "name": name, "udid": udid, "state": state}))
          PY
          )"
          printf '%s\n' "${DEVICE_INFO}" > "${PROOF_DIR}/simulator-device.json"
          DEVICE_UDID="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["udid"])' <<<"${DEVICE_INFO}")"

          if ! xcrun simctl boot "${DEVICE_UDID}"; then
            CURRENT_STATE="$(xcrun simctl list devices --json | python3 -c 'import json,sys; data=json.load(sys.stdin); target=sys.argv[1]; print(next(device["state"] for devices in data["devices"].values() for device in devices if device["udid"] == target))' "${DEVICE_UDID}")"
            test "${CURRENT_STATE}" = "Booted"
          fi
          xcrun simctl bootstatus "${DEVICE_UDID}" -b
          xcrun simctl install "${DEVICE_UDID}" "${APP_PATH}"
          xcrun simctl launch --terminate-running-process "${DEVICE_UDID}" "${BUNDLE_ID}" \
            | tee "${PROOF_DIR}/simulator-launch.raw.txt"
          sleep 10
          xcrun simctl io "${DEVICE_UDID}" screenshot "${PROOF_DIR}/pawmate-ios-post-change.png"
          xcrun simctl spawn "${DEVICE_UDID}" log show \
            --style compact \
            --last 3m \
            --predicate 'process == "Runner"' \
            > "${PROOF_DIR}/runner-log.raw.txt"

          test -s "${PROOF_DIR}/pawmate-ios-post-change.png"
          SCREENSHOT_BYTES="$(stat -f%z "${PROOF_DIR}/pawmate-ios-post-change.png")"
          test "${SCREENSHOT_BYTES}" -gt 10000
          shasum -a 256 "${PROOF_DIR}/pawmate-ios-post-change.png" \
            > "${PROOF_DIR}/pawmate-ios-post-change.sha256"
          if grep -E "Terminating app due to uncaught exception|Fatal error|SIGABRT" \
            "${PROOF_DIR}/runner-log.raw.txt"; then
            echo "Fatal iOS runtime fingerprint detected" >&2
            exit 1
          fi
      - name: Package Appetize simulator zip
        script: |
          set -euo pipefail
          cd mobile
          APP_PATH="build/ios/iphonesimulator/Runner.app"
          ZIP_DIR="build/ios/appetize"
          ZIP_PATH="${ZIP_DIR}/PawMate-appetize-simulator.zip"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected simulator app not found at $APP_PATH" >&2
            exit 1
          fi
          rm -rf "$ZIP_DIR"
          mkdir -p "$ZIP_DIR"
          (cd "$(dirname "$APP_PATH")" && zip -qry "../appetize/PawMate-appetize-simulator.zip" "$(basename "$APP_PATH")")
          ls -lh "$ZIP_PATH"
    artifacts:
      - mobile/build/ios/appetize/PawMate-appetize-simulator.zip
      - output-evidence/ios-post-change/**
    publishing:
      email:
        recipients:
          - duongngo0708@gmail.com
        notify:
          success: true
          failure: true
