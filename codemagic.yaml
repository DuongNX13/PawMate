workflows:
  ios-real-device-smoke:
    name: Day 7 iOS Real Device Smoke
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.pawmate.pawmateMobile
        PAWMATE_BACKEND_HEALTH_TIMEOUT_MS: "70000"
        PAWMATE_BACKEND_HEALTH_RETRY_INTERVAL_MS: "5000"
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.pawmate.pawmateMobile
    scripts:
      - name: Explain required runtime variables
        script: |
          set -euo pipefail
          if [ -z "${PAWMATE_API_BASE_URL:-}" ]; then
            echo "PAWMATE_API_BASE_URL is required for backend-backed register/login smoke."
          fi
          echo "This workflow produces a signed IPA artifact after Apple Developer signing is connected in Codemagic."
      - name: Validate backend URL for mobile smoke
        script: |
          set -euo pipefail
          node scripts/ci/validate-mobile-backend-url.mjs
      - name: Install Flutter dependencies
        script: |
          set -euo pipefail
          cd mobile
          flutter pub get
      - name: Static analysis
        script: |
          set -euo pipefail
          cd mobile
          flutter analyze
      - name: Unit and widget tests
        script: |
          set -euo pipefail
          cd mobile
          flutter test
      - name: Configure iOS signing
        script: |
          set -euo pipefail
          cd mobile
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          set -euo pipefail
          cd mobile
          flutter build ipa --release \
            --dart-define=PAWMATE_API_BASE_URL="${PAWMATE_API_BASE_URL}"
    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - mobile/build/ios/archive/*.xcarchive
    publishing:
      email:
        recipients:
          - duongngo0708@gmail.com
        notify:
          success: true
          failure: true

  ios-appetize-simulator-smoke:
    name: Day 7 iOS Appetize Simulator Smoke
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        PAWMATE_API_BASE_URL: https://pawmate-api-yteu.onrender.com
        PAWMATE_BACKEND_HEALTH_TIMEOUT_MS: "70000"
        PAWMATE_BACKEND_HEALTH_RETRY_INTERVAL_MS: "5000"
        PAWMATE_ENABLE_SYSTEM_PROXY: "true"
        PAWMATE_QA_PREFILL_AUTH: "true"
    scripts:
      - name: Explain Appetize simulator path
        script: |
          set -euo pipefail
          echo "This workflow builds an iOS Simulator .app for Appetize."
          echo "Appetize accepts a zip/tar.gz containing a simulator .app; device IPAs are not supported by Appetize."
          echo "Backend-backed register/login smoke requires a public HTTPS PAWMATE_API_BASE_URL."
          echo "Set PAWMATE_ENABLE_SYSTEM_PROXY=true when Appetize Network Logs must capture Flutter/Dio traffic."
      - name: Validate backend URL for mobile smoke
        script: |
          set -euo pipefail
          node scripts/ci/validate-mobile-backend-url.mjs
      - name: Install Flutter dependencies
        script: |
          set -euo pipefail
          cd mobile
          flutter pub get
      - name: Static analysis
        script: |
          set -euo pipefail
          cd mobile
          flutter analyze
      - name: Unit and widget tests
        script: |
          set -euo pipefail
          cd mobile
          flutter test
      - name: Build iOS simulator app
        script: |
          set -euo pipefail
          cd mobile
          flutter build ios --simulator --debug \
            --dart-define=PAWMATE_API_BASE_URL="${PAWMATE_API_BASE_URL}" \
            --dart-define=PAWMATE_ENABLE_SYSTEM_PROXY="${PAWMATE_ENABLE_SYSTEM_PROXY:-false}" \
            --dart-define=PAWMATE_QA_PREFILL_AUTH="${PAWMATE_QA_PREFILL_AUTH:-false}"
      - name: Package Appetize simulator zip
        script: |
          set -euo pipefail
          cd mobile
          APP_PATH="build/ios/iphonesimulator/Runner.app"
          ZIP_DIR="build/ios/appetize"
          ZIP_PATH="${ZIP_DIR}/PawMate-appetize-simulator.zip"
          if [ ! -d "$APP_PATH" ]; then
            echo "Expected simulator app not found at $APP_PATH" >&2
            exit 1
          fi
          rm -rf "$ZIP_DIR"
          mkdir -p "$ZIP_DIR"
          (cd "$(dirname "$APP_PATH")" && zip -qry "../appetize/PawMate-appetize-simulator.zip" "$(basename "$APP_PATH")")
          ls -lh "$ZIP_PATH"
    artifacts:
      - mobile/build/ios/appetize/PawMate-appetize-simulator.zip
    publishing:
      email:
        recipients:
          - duongngo0708@gmail.com
        notify:
          success: true
          failure: true
